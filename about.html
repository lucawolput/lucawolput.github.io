<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre mí | Luca Wolput</title>
  <meta name="description" content="Luca Wolput Pardos: experiencia, formación y certificaciones en marketing, branding y lujo.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-loading page-about">
  <a class="skip small" href="#main">Saltar al contenido</a>

  <header class="chrome small">
    <a href="index.html" data-k="chrome.brand"></a>
    <span class="chrome__hide" data-k="chrome.by"></span>
    <span class="chrome__hide" data-k="chrome.field"></span>
    <span class="chrome__hide" data-k="chrome.place"></span>
    <span class="chrome__right">
      <span class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </span>
      <button type="button" class="burger" aria-expanded="false" aria-controls="menu">
        <span data-k="chrome.menu"></span><i aria-hidden="true"><b></b><b></b><b></b></i>
      </button>
    </span>
  </header>

  <div class="menu" id="menu" aria-hidden="true">
    <div class="menu__inner">
      <div class="menu__top">
        <span class="small menu__label" data-k="menu.label"></span>
        <button type="button" class="menu__close small" data-k="chrome.close"></button>
      </div>
      <p class="menu__title" data-k="menu.title"></p>
      <ol class="menu__list" id="menu-list"></ol>
    </div>
  </div>

  <main id="main">
    <!-- Presentación -->
    <section class="ab-hero">
      <div class="ab-hero__text">
        <span class="small label" data-a="label"></span>
        <h1 class="ab-hero__title" data-a="title"></h1>
        <p class="phrase ab-hero__intro" data-a="intro"></p>
        <div class="ab-hero__bio" id="bio"></div>
        <a class="btn" id="cv" download><span data-a="cv_button"></span> <span class="btn__count" data-a="cv_note"></span></a>
      </div>
      <figure class="ab-hero__photo" data-reveal-img>
        <img data-asrc="photo" data-aalt="photo_alt" width="1100" height="1467">
        <figcaption class="small"><span data-a="photo_caption_left"></span><span data-a="photo_caption_right"></span></figcaption>
      </figure>
    </section>

    <!-- Experiencia -->
    <section class="ab-block" id="experiencia">
      <div class="ab-block__head"><h2 class="title" data-reveal data-a="experience_title"></h2></div>
      <div class="ab-block__body">
        <p class="small label" data-reveal data-a="experience_label"></p>
        <ol class="rows" id="exp"></ol>
        <p class="small label ab-other" data-reveal data-a="other_label"></p>
        <ol class="rows" id="other"></ol>
      </div>
    </section>

    <!-- Formación -->
    <section class="ab-block" id="formacion">
      <div class="ab-block__head"><h2 class="title" data-reveal data-a="education_title"></h2></div>
      <div class="ab-block__body"><ol class="rows" id="edu"></ol></div>
    </section>

    <!-- Certificaciones -->
    <section class="ab-block" id="certificaciones">
      <div class="ab-block__head"><h2 class="title" data-reveal data-a="cert_title"></h2></div>
      <div class="ab-block__body"><ol class="rows rows--certs" id="certs"></ol></div>
    </section>

    <!-- Competencias -->
    <section class="ab-block ab-block--last" id="competencias">
      <div class="ab-block__head"><h2 class="title" data-reveal data-a="skills_title"></h2></div>
      <div class="ab-block__body"><ul class="skills" id="skills"></ul></div>
    </section>

    <!-- Contacto -->
    <section class="contact" id="contacto">
      <div class="contact__card" data-reveal>
        <div><span class="small label" data-k="contact.label"></span><h2 class="title" data-k="contact.title"></h2></div>
        <div class="contact__right">
          <p data-k="contact.text"></p>
          <div>
            <a class="contact__mail" id="mail"></a>
            <a class="contact__li small" id="linkedin" target="_blank" rel="noopener" data-k="contact.linkedin_label"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer small"><span data-k="footer.left"></span><span data-k="footer.center"></span><span data-k="footer.right"></span></footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
